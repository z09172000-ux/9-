<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社區篩檢登記系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #115293;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2c3e50;
      --text-muted: #666;
      --border: #e0e0e0;
      --danger: #d32f2f;
      --success: #388e3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      text-align: center;
    }
    .badge {
      font-size: 13px;
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: #e2e8f0;
      color: #4a5568;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; flex: 2; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #4a5568; flex: 1; }
    .btn-export {
      background: var(--success);
      color: #fff;
      width: 100%;
      margin-top: 16px;
    }
    .btn-export:hover { background: #2e7031; }
    .btn-clear-all {
      background: #fff;
      color: var(--danger);
      border: 1.5px solid #fecaca;
      width: 100%;
      margin-top: 10px;
    }
    .btn-clear-all:hover { background: #fee2e2; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .table-container {
      overflow-x: auto;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f8fafc;
      font-weight: 700;
      color: #475569;
    }
    .btn-del {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    .btn-del:hover { background: #fecaca; }
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 30px;
      padding: 12px;
    }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      z-index: 999;
    }
  </style>
</head>
<body>

<div id="loadingOverlay">資料傳輸中，請稍候...</div>

<div class="container">
  <header>
    <div class="badge">COMMUNITY SCREENING · 社區篩檢</div>
    <h1>篩檢登記系統</h1>
    <div class="subtitle">基本資料 · 年齡 · 教育程度</div>
  </header>

  <nav>
    <button class="tab-btn active" onclick="switchTab('register')">民眾登記</button>
    <button class="tab-btn" onclick="switchTab('list')">名單列表與統計</button>
  </nav>

  <!-- 登記頁籤 -->
  <section id="tab-register" class="card">
    <form id="regForm" onsubmit="handleFormSubmit(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="name" required placeholder="請輸入姓名">
        </div>
        <div class="form-group">
          <label>身分證字號 *</label>
          <input type="text" id="idnum" required placeholder="例：A123456789">
        </div>
        <div class="form-group">
          <label>聯絡電話 *</label>
          <input type="tel" id="phone" required placeholder="例：0912345678">
        </div>
        <div class="form-group">
          <label>出生年月日</label>
          <input type="date" id="birthdate" onchange="calculateAge()">
        </div>
        <div class="form-group">
          <label>年齡</label>
          <input type="number" id="age" min="0" max="130" placeholder="可手動輸入或由生日計算">
        </div>
        <div class="form-group">
          <label>教育程度</label>
          <select id="edu">
            <option value="">請選擇</option>
            <option value="不識字">不識字</option>
            <option value="國小">國小</option>
            <option value="國中">國中</option>
            <option value="高中／高職">高中／高職</option>
            <option value="專科">專科</option>
            <option value="大學">大學</option>
            <option value="研究所以上">研究所以上</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">送出登記</button>
        <button type="reset" class="btn btn-secondary">清除重填</button>
      </div>
    </form>
  </section>

  <!-- 列表頁籤 -->
  <section id="tab-list" class="card" style="display: none;">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="stat-count">0</div>
        <div class="stat-label">已登記人數</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-age">–</div>
        <div class="stat-label">平均年齡</div>
      </div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>姓名</th>
            <th>身分證</th>
            <th>電話</th>
            <th>年齡</th>
            <th>教育程度</th>
            <th>登記時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="data-tbody">
          <tr><td colspan="7" style="text-align: center; color: #888;">載入中...</td></tr>
        </tbody>
      </table>
    </div>
    <button class="btn btn-export" onclick="exportCSV()">匯出 CSV（Excel／Notion 可用）</button>
    <button class="btn btn-clear-all" onclick="clearAllData()">清除全部資料</button>
  </section>

  <footer>⚠️ 資料會即時寫入後端 Google 試算表，請妥善保管連結</footer>
</div>

<script>
  // 請在此處貼上您的 Apps Script 網頁應用程式 URL
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoWVpqK4JKOPLIP3Z_p71RVJ5RulWjfYMclJwx6oxrzkL_rZFGTEE2W2TvGhKwlYyM/exec';

  let currentData = [];

  function switchTab(tab) {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs[0].classList.toggle('active', tab === 'register');
    tabs[1].classList.toggle('active', tab === 'list');
    document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
    if (tab === 'list') {
      fetchList();
    }
  }

  function calculateAge() {
    const bDate = document.getElementById('birthdate').value;
    if (!bDate) return;
    const birth = new Date(bDate);
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
      age--;
    }
    if (age >= 0) {
      document.getElementById('age').value = age;
    }
  }

  function showLoading(show) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  }

  async function fetchList() {
    showLoading(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'list' })
      });
      const data = await res.json();
      currentData = data;
      renderTable(data);
    } catch (err) {
      alert('讀取失敗，請確認 Apps Script 部署網址是否正確！');
    } finally {
      showLoading(false);
    }
  }

  function renderTable(list) {
    const tbody = document.getElementById('data-tbody');
    tbody.innerHTML = '';
    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">目前尚無登記資料</td></tr>';
      document.getElementById('stat-count').innerText = 0;
      document.getElementById('stat-age').innerText = '–';
      return;
    }

    let totalAge = 0;
    let ageCount = 0;

    list.forEach(item => {
      const tr = document.createElement('tr');
      const timeStr = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-TW', { hour12: false }) : '';
      tr.innerHTML = `
        <td><strong>${item.name || ''}</strong></td>
        <td>${item.idnum || ''}</td>
        <td>${item.phone || ''}</td>
        <td>${item.age ? item.age + ' 歲' : '–'}</td>
        <td>${item.edu || '–'}</td>
        <td style="font-size: 12px; color: #666;">${timeStr}</td>
        <td><button class="btn-del" onclick="deleteEntry('${item.id}')">刪除</button></td>
      `;
      tbody.appendChild(tr);

      if (item.age) {
        totalAge += Number(item.age);
        ageCount++;
      }
    });

    document.getElementById('stat-count').innerText = list.length;
    document.getElementById('stat-age').innerText = ageCount > 0 ? (totalAge / ageCount).toFixed(1) + ' 歲' : '–';
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    showLoading(true);

    const entry = {
      id: Date.now().toString(),
      name: document.getElementById('name').value.trim(),
      idnum: document.getElementById('idnum').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      birthdate: document.getElementById('birthdate').value,
      age: document.getElementById('age').value,
      edu: document.getElementById('edu').value,
      createdAt: new Date().toISOString()
    };

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'upsert', entry: entry })
      });
      await res.json();
      alert('登記成功！');
      document.getElementById('regForm').reset();
    } catch (err) {
      alert('登記失敗，請檢查網路連線或 Apps Script 設定！');
    } finally {
      showLoading(false);
    }
  }

  async function deleteEntry(id) {
    if (!confirm('確定要刪除這筆資料嗎？')) return;
    showLoading(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: id })
      });
      const data = await res.json();
      currentData = data;
      renderTable(data);
    } catch (err) {
      alert('刪除失敗！');
    } finally {
      showLoading(false);
    }
  }

  async function clearAllData() {
    if (!currentData || currentData.length === 0) {
      alert('目前沒有資料可清除');
      return;
    }
    if (!confirm(`確定要清除全部 ${currentData.length} 筆資料嗎？此動作無法復原，建議清除前先匯出 CSV 備份。`)) return;
    showLoading(true);
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'clear' })
      });
      const data = await res.json();
      currentData = data;
      renderTable(data);
    } catch (err) {
      alert('清除失敗，請確認後端 Apps Script 是否支援 clear 動作！');
    } finally {
      showLoading(false);
    }
  }

  function exportCSV() {
    if (!currentData || currentData.length === 0) {
      alert('目前沒有資料可匯出');
      return;
    }
    const header = ['姓名', '身分證字號', '電話', '出生年月日', '年齡', '教育程度', '登記時間'];
    const rows = currentData.map(item => {
      const timeStr = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-TW', { hour12: false }) : '';
      return [item.name || '', item.idnum || '', item.phone || '', item.birthdate || '', item.age || '', item.edu || '', timeStr];
    });
    const csv = '\uFEFF' + [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `社區篩檢名單_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
